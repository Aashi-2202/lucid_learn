[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lucid"
version = "0.1.0"
description = "Temporal fairness assessment and root-cause explanation framework built on Fairlearn"
requires-python = ">=3.10"
dependencies = [
    "fairlearn",
    "pandas",
    "numpy",
    "scikit-learn",
]

[tool.setuptools]
packages = ["lucid"]